syntax = "proto3";

package openim.rtc.proto;
option csharp_namespace = "LiveKit.Proto";
option go_package = "github.com/openimsdk/openim-rtc/proto/go/rpc";

message RpcError {
  uint32 code = 1;
  string message = 2;
  string data = 3;
}

// FFI Requests
message PerformRpcRequest {
  uint64 local_participant_handle = 1;
  string destination_identity = 2;
  string method = 3;
  string payload = 4;
  uint32 response_timeout_ms = 5;
}

message RegisterRpcMethodRequest {
  uint64 local_participant_handle = 1;
  string method = 2;
}

message UnregisterRpcMethodRequest {
  uint64 local_participant_handle = 1;
  string method = 2;
}

message RpcMethodInvocationResponseRequest {
  uint64 local_participant_handle = 1;
  uint64 invocation_id = 2;
  string payload = 3;
  RpcError error = 4;
}

// FFI Responses
message PerformRpcResponse { uint64 async_id = 1; }

message RegisterRpcMethodResponse {}

message UnregisterRpcMethodResponse {}

message RpcMethodInvocationResponseResponse { string error = 1; }

// FFI Callbacks
message PerformRpcCallback {
  uint64 async_id = 1;
  string payload = 2;
  RpcError error = 3;
}

// FFI Events
message RpcMethodInvocationEvent {
  uint64 local_participant_handle = 1;
  uint64 invocation_id = 2;
  string method = 3;
  string request_id = 4;
  string caller_identity = 5;
  string payload = 6;
  uint32 response_timeout_ms = 7;
}
