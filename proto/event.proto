syntax = "proto3";
package openim.rtc.event;

option csharp_namespace = "OpenIM.RTC.Proto";
option go_package = "github.com/openimsdk/openim-rtc/proto/go/event";

import "error.proto";

enum FuncEventName {
  None = 0;
  // Room
  Connect = 1;
  Disconnect = 2;
  PublishTrack = 3;
  UnpublishTrack = 4;
  PublishData = 5;
  SetSubscribed = 6;
  SetLocalMetadata = 7;
  SetLocalName = 8;
  SetLocalAttributes = 9;
  GetSessionStats = 10;
  PublishTranscription = 11;
  EnableRemoteTrackPublication = 12;
  UpdateRemoteTrackPublicationDimension = 13;
  SendStreamHeader = 14;
  SendStreamChunk = 15;
  SendStreamTrailer = 16;
  SetDataChannelBufferedAmountLowThreshold = 17;
  // Track
  CreateVideoTrack = 101;
  CreateAudioTrack = 102;
  LocalTrackMute = 103;
  EnableRemoteTrack = 104;
  GetStats = 105;
  SetTrackSubscriptionPermissions = 106;
  // Audio
  NewAudioStream = 201;
  NewAudioSource = 202;
  CaptureAudioFrame = 203;
  ClearAudioBuffer = 204;
  NewAudioResampler = 205;
  RemixAndResample = 206;
  AudioStreamFromParticipant = 207;
  // Video
  NewVideoStream = 301;
  NewVideoSource = 302;
  CaptureVideoFrame = 303;
  VideoConvert = 304;
  VideoStreamFromParticipan = 305;
  //   event
  RoomEvent = 1001;
  
}

message FfiRequest {
  // note: This field is optional and is only used for interaction between Go
  // and JS.
  string operationId = 1;
  // The handle Id.
  int64 handleId = 2;
  // Function request event name.
  FuncEventName eventName = 3;
  // The request data.
  bytes data = 4;
}

message FfiResult {
  openim.rtc.error.ErrCode errCode = 1;
  string errMsg = 2;
  FuncEventName eventName = 3;
  // The result data.
  bytes data = 4;
  // handleId
  int64 handleId = 5;
}